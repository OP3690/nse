name: NSE Flow refresh

# Runs the fast incremental pipeline 4× a day (every 6 hours) and pushes the
# fresh payload (incl. KNN Multibagger Radar) to MongoDB Atlas, which the
# deployed site reads. Also runnable on demand, and via a repository_dispatch
# ping (used by the Vercel cron trigger).
on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # 00:00 / 06:00 / 12:00 / 18:00 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "Days of history to backfill before refresh (first-time seed; leave blank to skip)"
        required: false
        default: ""
  repository_dispatch:
    types: [refresh]

# Never let two runs touch the cached DB at once.
concurrency:
  group: nse-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persist the SQLite DB + raw files between runs so refresh.py only fetches
      # the last few sessions and never refetches immutable history. A unique key
      # each run + the nse-data- prefix restore gives a rolling, always-saved cache.
      - name: Restore pipeline data
        uses: actions/cache@v4
        with:
          path: |
            pipeline/data/nse.db
            pipeline/data/raw
          key: nse-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nse-data-

      - name: Install dependencies
        run: pip install --quiet -r pipeline/requirements.txt

      # Merge committed history that 3rd-party feeds can't re-serve (cash FII/DII,
      # FPI/derivative flow series). Idempotent INSERT OR IGNORE: fills only the
      # dates a cold/thin cloud DB is missing, so the dashboard's FII/DII chart
      # and flow history survive every run instead of collapsing to 1 point.
      - name: Load seed history
        working-directory: pipeline
        run: python seed_io.py load

      # First-time seed only: `workflow_dispatch` with a backfill day count, or an
      # empty cache. Builds the history the signals + KNN model need.
      - name: Seed history (optional)
        if: ${{ github.event.inputs.backfill != '' }}
        working-directory: pipeline
        run: python backfill.py "${{ github.event.inputs.backfill }}"

      - name: Fast refresh (+ KNN + Mongo sync)
        working-directory: pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
        run: python refresh.py
