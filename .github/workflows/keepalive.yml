name: Keepalive

# GitHub automatically disables *scheduled* workflows after 60 days without any
# repository activity (this is what silently killed the NSE Flow refresh — and
# with it the Sync button, since a disabled workflow ignores every trigger).
#
# This job makes a tiny commit once a week. A weekly commit is well inside the
# 60-day window, so it keeps the repo "active" and stops GitHub from ever
# disabling refresh.yml (or this workflow) for inactivity again. The push uses
# the default GITHUB_TOKEN, which by design does NOT retrigger any workflow, so
# it costs nothing but a one-line heartbeat commit.
on:
  schedule:
    - cron: "17 5 * * 1" # 05:17 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat commit
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name  "nse-flow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive heartbeat [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push
